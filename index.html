<body>

    <!-- شاشة الدخول -->
    <div id="loginPage">
        <div class="login-box">
            <div class="logo"><i class="fas fa-oil-can"></i></div>

            <input type="text" id="loginUser" placeholder="اسم المستخدم" value="admin">
            <input type="password" id="loginPass" placeholder="كلمة المرور" value="admin123">
            <button onclick="handleLogin()"><i class="fas fa-key"></i> دخول</button>

    <!-- التطبيق -->
    <div id="app">

                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>خروج</span></button>
            </aside>

        </div>
    </div>

    <!-- منطقة الطباعة -->
    <div id="receiptArea">
        <div style="text-align:center; border-bottom:2px dashed #ccc; padding-bottom:10px;">
            <h2 style="color:#000;">أبوالسعود علام للزيوت</h2>

        <table style="width:100%; border-collapse:collapse; margin:10px 0; color:#000;">
            <thead><tr style="background:#eee;"><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
            <tbody id="rItems"></tbody>
        </table>
        <div style="border-top:2px dashed #ccc; padding-top:10px;">
            <div class="flex-between"><span>الإجمالي</span><span id="rTotalBefore"></span></div>
            <div class="flex-between"><span>الخصم</span><span id="rDiscount"></span></div>
            <div class="flex-between" style="font-size:20px; font-weight:bold;"><span>الإجمالي النهائي</span><span id="rTotalAfter"></span></div>
            <div class="flex-between"><span>المدفوع</span><span id="rPaid"></span></div>
            <div class="flex-between"><span>المتبقي</span><span id="rRemain"></span></div>
        </div>
        <div style="text-align:center; margin-top:20px; font-size:12px; color:#888;">شكراً لتعاملكم</div>
        <hr style="margin:15px 0; border:1px dashed #ccc;">
        <div style="text-align:center; font-size:12px; color:#888;">نسخة المحاسب</div>
    </div>

    <script>
        // ================================================================
        // 1. قاعدة البيانات
        // ================================================================
        function getDB() {
            let db = localStorage.getItem('AbuSaudOilDB_v4');
            if (!db) {
                const init = {
                    users: [
                        { id: 1, name: 'صاحب الشركة', username: 'admin', password: 'admin123', role: 'admin',
                            salary: 0, advances: 0, absences: 0 },
                        { id: 2, name: 'كاشير المحل', username: 'cashier', password: 'cash123', role: 'cashier',
                            salary: 3000, advances: 0, absences: 0 }
                    ],
                    regularEmployees: [
                        { id: 1, name: 'محمد سيد', salary: 2500, advances: 0, absences: 0 },
                        { id: 2, name: 'أحمد علي', salary: 2000, advances: 0, absences: 0 }
                    ],
                    products: [
                        { id: 1, code: 'OIL-001', name: 'زيت موتور 20W-50', costPrice: 80, sellPrice: 120,
                            qty_main: 50, qty_matriya: 20 },
                        { id: 2, code: 'OIL-002', name: 'زيت جير 80W-90', costPrice: 60, sellPrice: 90,
                            qty_main: 30, qty_matriya: 10 },
                        { id: 3, code: 'OIL-003', name: 'زيت فرامل DOT4', costPrice: 50, sellPrice: 75,
                            qty_main: 15, qty_matriya: 5 }
                    ],
                    customers: [{ id: 1, name: 'محل السيارات الحديثة', phone: '01001234567', balance: 0 }],
                    suppliers: [{ id: 1, name: 'مصنع الزيوت المصرية', phone: '01009876543', balance: 0 }],
                    sales: [],
                    purchases: [],
                    transfers: [],
                    expenses: [],
                    cashbox: [],
                    bank: [],
                    capital: { capitalAmount: 0, setupCost: 0, startDate: new Date().toISOString().slice(0,
                            10) },
                    nextSaleId: 1,
                    nextPurchaseId: 1,
                    nextTransferId: 1,
                    nextExpId: 1,
                    nextCustId: 2,
                    nextSuppId: 2,
                    nextRegEmpId: 3
                };
                localStorage.setItem('AbuSaudOilDB_v4', JSON.stringify(init));
                return init;
            }
            try {
                return JSON.parse(db);
            } catch (error) {
                // لا تجعل بيانات محلية تالفة تمنع تشغيل النظام بالكامل.
                localStorage.removeItem('AbuSaudOilDB_v4');
                return getDB();
            }
        }

        function saveDB(db) { 
            localStorage.setItem('AbuSaudOilDB_v4', JSON.stringify(db)); 
        }

        function nextId(items) {
            return items.reduce((max, item) => Math.max(max, Number(item.id) || 0), 0) + 1;
        }

        function asNumber(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function todayString() {
            return new Date().toISOString().slice(0, 10);
        }

        // ترحيل بيانات الإصدارات القديمة: بعض النسخ كانت تحفظ الأرقام كنصوص
        // أو تترك حقولاً ناقصة، وهذا كان يوقف لوحة القيادة والرواتب عند العرض.
        function normalizeDB(data) {
            const normalized = data && typeof data === 'object' ? data : {};
            const today = todayString();

            if (!Array.isArray(normalized.users) || normalized.users.length === 0) {
                normalized.users = [
                    { id: 1, name: 'صاحب الشركة', username: 'admin', password: 'admin123', role: 'admin',
                        salary: 0, advances: 0, absences: 0 },
                    { id: 2, name: 'كاشير المحل', username: 'cashier', password: 'cash123', role: 'cashier',
                        salary: 3000, advances: 0, absences: 0 }
                ];
            }
            if (!Array.isArray(normalized.regularEmployees)) {
                normalized.regularEmployees = [
                    { id: 1, name: 'محمد سيد', salary: 2500, advances: 0, absences: 0 },
                    { id: 2, name: 'أحمد علي', salary: 2000, advances: 0, absences: 0 }
                ];
            }
            if (!Array.isArray(normalized.products)) {
                normalized.products = [
                    { id: 1, code: 'OIL-001', name: 'زيت موتور 20W-50', costPrice: 80, sellPrice: 120, qty_main: 50, qty_matriya: 20 },
                    { id: 2, code: 'OIL-002', name: 'زيت جير 80W-90', costPrice: 60, sellPrice: 90, qty_main: 30, qty_matriya: 10 },
                    { id: 3, code: 'OIL-003', name: 'زيت فرامل DOT4', costPrice: 50, sellPrice: 75, qty_main: 15, qty_matriya: 5 }
                ];
            }
            if (!Array.isArray(normalized.customers)) {
                normalized.customers = [{ id: 1, name: 'محل السيارات الحديثة', phone: '01001234567', balance: 0 }];
            }
            if (!Array.isArray(normalized.suppliers)) {
                normalized.suppliers = [{ id: 1, name: 'مصنع الزيوت المصرية', phone: '01009876543', balance: 0 }];
            }
            if (!Array.isArray(normalized.sales)) normalized.sales = [];
            if (!Array.isArray(normalized.purchases)) normalized.purchases = [];
            if (!Array.isArray(normalized.transfers)) normalized.transfers = [];
            if (!Array.isArray(normalized.expenses)) normalized.expenses = [];
            if (!Array.isArray(normalized.cashbox)) normalized.cashbox = [];
            if (!Array.isArray(normalized.bank)) normalized.bank = [];
            if (!Array.isArray(normalized.heldSales)) normalized.heldSales = [];
            if (!Array.isArray(normalized.returns)) normalized.returns = [];
            if (!Array.isArray(normalized.customerPayments)) normalized.customerPayments = [];
            if (!Array.isArray(normalized.payrollHistory)) normalized.payrollHistory = [];
            if (!Array.isArray(normalized.bundles)) normalized.bundles = [];
            if (!Array.isArray(normalized.setupExpenses)) normalized.setupExpenses = [];

            const collections = [
                'users', 'regularEmployees', 'products', 'customers', 'suppliers',
                'sales', 'purchases', 'transfers', 'expenses', 'cashbox', 'bank'
            ];
            collections.forEach(name => {
                normalized[name] = normalized[name].filter(
                    item => item && typeof item === 'object'
                );
            });
            if (normalized.users.length === 0) {
                normalized.users = [
                    { id: 1, name: 'صاحب الشركة', username: 'admin', password: 'admin123', role: 'admin',
                        salary: 0, advances: 0, absences: 0 },
                    { id: 2, name: 'كاشير المحل', username: 'cashier', password: 'cash123', role: 'cashier',
                        salary: 3000, advances: 0, absences: 0 }
                ];
            }

            normalized.users.forEach(user => {
                user.id = asNumber(user.id, nextId(normalized.users));
                user.name = String(user.name || 'موظف');
                user.username = String(user.username || '');
                user.role = user.role === 'admin' ? 'admin' : 'cashier';
                user.salary = asNumber(user.salary);
                user.advances = asNumber(user.advances);
                user.absences = asNumber(user.absences);
            });

            normalized.regularEmployees.forEach(employee => {
                employee.id = asNumber(employee.id, nextId(normalized.regularEmployees));
                employee.name = String(employee.name || 'موظف');
                employee.salary = asNumber(employee.salary);
                employee.advances = asNumber(employee.advances);
                employee.absences = asNumber(employee.absences);
            });

            normalized.products.forEach(product => {
                product.id = asNumber(product.id, nextId(normalized.products));
                product.code = String(product.code || `ITEM-${product.id}`);
                product.barcode = String(product.barcode || '');
                product.name = String(product.name || 'صنف');
                product.costPrice = asNumber(product.costPrice);
                product.sellPrice = asNumber(product.sellPrice);
                product.qty_main = Math.max(0, asNumber(product.qty_main));
                product.qty_matriya = Math.max(0, asNumber(product.qty_matriya));
            });

            normalized.customers.forEach(customer => {
                customer.id = asNumber(customer.id, nextId(normalized.customers));
                customer.name = String(customer.name || 'عميل');
                customer.phone = String(customer.phone || 'غير مسجل');
                customer.balance = asNumber(customer.balance);
            });

            normalized.suppliers.forEach(supplier => {
                supplier.id = asNumber(supplier.id, nextId(normalized.suppliers));
                supplier.name = String(supplier.name || 'مورد');
                supplier.phone = String(supplier.phone || 'غير مسجل');
                supplier.balance = asNumber(supplier.balance);
            });

            normalized.sales.forEach(sale => {
                sale.id = asNumber(sale.id, nextId(normalized.sales));
                sale.date = String(sale.date || today);
                sale.customerId = asNumber(sale.customerId);
                sale.customerName = String(sale.customerName || 'عميل');
                sale.customerPhone = String(sale.customerPhone || '');
                sale.items = Array.isArray(sale.items) ? sale.items : [];
                sale.items = sale.items.map(item => ({
                    ...item,
                    productId: asNumber(item.productId),
                    name: String(item.name || ''),
                    qty: Math.max(0, asNumber(item.qty)),
                    price: Math.max(0, asNumber(item.price)),
                    branch: item.branch === 'matriya' ? 'matriya' : 'main'
                }));
                sale.totalBefore = asNumber(sale.totalBefore, sale.items.reduce((sum, item) => sum + item.qty * item.price, 0));
                sale.discount = Math.max(0, asNumber(sale.discount));
                sale.totalAfter = asNumber(sale.totalAfter, Math.max(0, sale.totalBefore - sale.discount));
                sale.paid = Math.max(0, asNumber(sale.paid));
                sale.remain = asNumber(sale.remain, Math.max(0, sale.totalAfter - sale.paid));
            });

            normalized.purchases.forEach(purchase => {
                purchase.id = asNumber(purchase.id, nextId(normalized.purchases));
                purchase.supplierId = asNumber(purchase.supplierId);
                purchase.supplierName = String(purchase.supplierName || 'مورد');
                purchase.date = String(purchase.date || today);
                purchase.items = Array.isArray(purchase.items) ? purchase.items : [];
                purchase.totalCost = asNumber(purchase.totalCost, purchase.items.reduce(
                    (sum, item) => sum + asNumber(item.qty) * asNumber(item.buyPrice), 0
                ));
                purchase.paid = Math.max(0, asNumber(purchase.paid));
                purchase.remain = asNumber(purchase.remain, Math.max(0, purchase.totalCost - purchase.paid));
                purchase.paymentMethod = String(purchase.paymentMethod || 'credit');
                purchase.branch = purchase.branch === 'matriya' ? 'matriya' : 'main';
            });

            normalized.expenses.forEach(expense => {
                expense.id = asNumber(expense.id, nextId(normalized.expenses));
                expense.category = String(expense.category || 'أخرى');
                expense.description = String(expense.description || 'مصروف');
                expense.amount = Math.max(0, asNumber(expense.amount));
                expense.date = String(expense.date || today);
            });

            normalized.heldSales = normalized.heldSales.filter(item => item && typeof item === 'object').map(item => ({
                ...item,
                items: Array.isArray(item.items) ? item.items : [],
                customerName: String(item.customerName || ''),
                customerPhone: String(item.customerPhone || ''),
                createdAt: String(item.createdAt || today)
            }));
            normalized.returns = normalized.returns.filter(item => item && typeof item === 'object');
            normalized.customerPayments = normalized.customerPayments.filter(item => item && typeof item === 'object');
            normalized.payrollHistory = normalized.payrollHistory.filter(item => item && typeof item === 'object');
            normalized.bundles = normalized.bundles.filter(item => item && typeof item === 'object').map(bundle => ({
                ...bundle,
                id: asNumber(bundle.id, nextId(normalized.bundles)),
                name: String(bundle.name || 'باقة'),
                price: Math.max(0, asNumber(bundle.price)),
                items: Array.isArray(bundle.items) ? bundle.items : []
            }));

            // إزالة الأرصدة التجريبية القديمة فقط إذا لم يسجل المستخدم أي حركة.
            // أي رصيد أو حركة أدخلها المستخدم تظل محفوظة كما هي.
            const hasActivity = normalized.sales.length || normalized.purchases.length ||
                normalized.expenses.length || normalized.transfers.length ||
                normalized.customerPayments.length || normalized.payrollHistory.length;
            const isSeedEntry = (entries, amount) => entries.length === 1 &&
                asNumber(entries[0].amount) === amount &&
                entries[0].description === 'رصيد افتتاحي';
            if (!hasActivity && isSeedEntry(normalized.cashbox, 5000)) normalized.cashbox = [];
            if (!hasActivity && isSeedEntry(normalized.bank, 20000)) normalized.bank = [];

            [...normalized.cashbox, ...normalized.bank].forEach(entry => {
                entry.id = asNumber(entry.id, 0);
                entry.amount = asNumber(entry.amount);
                entry.date = String(entry.date || today);
                entry.description = String(entry.description || '');
            });

            normalized.capital = normalized.capital && typeof normalized.capital === 'object'
                ? normalized.capital
                : { capitalAmount: 0, setupCost: 0, startDate: today };
            if (!hasActivity && asNumber(normalized.capital.capitalAmount) === 100000 &&
                asNumber(normalized.capital.setupCost) === 15000) {
                normalized.capital.capitalAmount = 0;
                normalized.capital.setupCost = 0;
            }
            normalized.capital.capitalAmount = asNumber(normalized.capital.capitalAmount);
            normalized.capital.setupCost = asNumber(normalized.capital.setupCost);
            normalized.capital.startDate = String(normalized.capital.startDate || today);
            normalized.setupExpenses = normalized.setupExpenses.filter(item => item && typeof item === 'object').map(item => ({
                ...item,
                id: asNumber(item.id, nextId(normalized.setupExpenses)),
                description: String(item.description || 'مصاريف تأسيس'),
                amount: Math.max(0, asNumber(item.amount)),
                paid: Boolean(item.paid),
                paymentMethod: item.paymentMethod === 'bank' ? 'bank' : 'cash',
                date: String(item.date || normalized.capital.startDate),
                notes: String(item.notes || '')
            })).filter(item => item.amount > 0);
            if (!normalized.setupExpenses.length && normalized.capital.setupCost > 0) {
                normalized.setupExpenses.push({
                    id: 1,
                    description: 'مصاريف تأسيس سابقة',
                    amount: normalized.capital.setupCost,
                    paid: false,
                    paymentMethod: 'cash',
                    date: normalized.capital.startDate,
                    notes: 'تم ترحيلها من النسخة السابقة',
                    legacy: true
                });
            }
            normalized.capital.setupCost = normalized.setupExpenses.reduce((sum, item) => sum + item.amount, 0);

            normalized.nextSaleId = Math.max(asNumber(normalized.nextSaleId), nextId(normalized.sales));
            normalized.nextPurchaseId = Math.max(asNumber(normalized.nextPurchaseId), nextId(normalized.purchases));
            normalized.nextTransferId = Math.max(asNumber(normalized.nextTransferId), nextId(normalized.transfers));
            normalized.nextExpId = Math.max(asNumber(normalized.nextExpId), nextId(normalized.expenses));
            normalized.nextCustId = Math.max(asNumber(normalized.nextCustId), nextId(normalized.customers));
            normalized.nextSuppId = Math.max(asNumber(normalized.nextSuppId), nextId(normalized.suppliers));
            normalized.nextRegEmpId = Math.max(asNumber(normalized.nextRegEmpId), nextId(normalized.regularEmployees));

            return normalized;
        }

        let currentUser = null;
        let db = normalizeDB(getDB());
        saveDB(db);

        function isManager() {
            return Boolean(currentUser && currentUser.role === 'admin');
        }

        function requireManager(action = 'هذا الإجراء') {
            if (isManager()) return true;
            alert(`غير مسموح للكاشير: المدير فقط يستطيع ${action}`);
            return false;
        }

        // ================================================================
        // 2. تسجيل الدخول
        // ================================================================
        function handleLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const user = db.users.find(x => x.username === u && x.password === p);
            if (!user) { 
                document.getElementById('loginError').style.display = 'block'; 
                return; 
            }
            document.getElementById('loginError').style.display = 'none';
            currentUser = user;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            initApp();
        }

        // ================================================================
        // 3. تهيئة التطبيق والقوائم
        // ================================================================
        function initApp() {
            document.getElementById('displayName').innerText = currentUser.name;
            document.getElementById('displayRole').innerText = currentUser.role === 'admin' ? 'مدير' : 'كاشير';

            const menu = document.getElementById('menuContainer');
            menu.innerHTML = '';

            // قائمة الصفحات مع الصلاحيات المطلوبة
            const items = [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'الرئيسية', roles: ['admin'] },
                { id: 'inventory', icon: 'fa-warehouse', label: 'المخزون والفروع', roles: ['admin', 'cashier'] },
                { id: 'sales', icon: 'fa-cash-register', label: 'المبيعات', roles: ['admin', 'cashier'] },
                { id: 'purchases', icon: 'fa-truck', label: 'التوريدات', roles: ['admin', 'cashier'] },
                { id: 'employees', icon: 'fa-users', label: 'الموظفين والرواتب', roles: ['admin'] },
                { id: 'expenses', icon: 'fa-money-bill-wave', label: 'المصروفات', roles: ['admin', 'cashier'] },
                { id: 'finance', icon: 'fa-landmark', label: 'المالية', roles: ['admin'] },
                { id: 'reports', icon: 'fa-file-alt', label: 'التقارير', roles: ['admin'] },
            ];

            items.forEach(it => {
                // التحقق من الصلاحيات
                if (it.roles.includes(currentUser.role)) {
                    const div = document.createElement('div');
                    div.className = 'menu-item';
                    div.dataset.page = it.id;
                    div.innerHTML = `<i class="fas ${it.icon}"></i><span>${it.label}</span>`;
                    div.onclick = () => navigateTo(it.id);
                    menu.appendChild(div);
                }
            });

            // تحديد الصفحة الافتراضية
            if (currentUser.role === 'cashier') {
                navigateTo('sales');
            } else {
                navigateTo('dashboard');
            }
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.menu-item[data-page="${pageId}"]`);
            if (activeEl) activeEl.classList.add('active');
            
            const main = document.getElementById('mainContent');
            
            // التحقق من الصلاحية قبل عرض الصفحة
            const pageConfig = {
                dashboard: { roles: ['admin'] },
                inventory: { roles: ['admin', 'cashier'] },
                sales: { roles: ['admin', 'cashier'] },
                purchases: { roles: ['admin', 'cashier'] },
                employees: { roles: ['admin'] },
                expenses: { roles: ['admin', 'cashier'] },
                finance: { roles: ['admin'] },
                reports: { roles: ['admin'] }
            };
            
            if (!pageConfig[pageId] || !pageConfig[pageId].roles.includes(currentUser.role)) {
                main.innerHTML = '<h1>⚠️ غير مصرح لك بالوصول إلى هذه الصفحة</h1>';
                return;
            }
            
            switch (pageId) {
                case 'dashboard':
                    renderDashboard(main);
                    break;
                case 'inventory':
                    renderInventory(main);
                    break;
                case 'sales':
                    renderSales(main);
                    break;
                case 'purchases':
                    renderPurchases(main);
                    break;
                case 'employees':
                    renderEmployees(main);
                    break;
                case 'expenses':
                    renderExpenses(main);
                    break;
                case 'finance':
                    renderFinance(main);
                    break;
                case 'reports':
                    renderReports(main);
                    break;
                default:
                    main.innerHTML = '<h1>صفحة غير موجودة</h1>';
            }
        }

        // ================================================================
        // 4. شاشة الرئيسية
        // ================================================================
        function renderDashboard(container) {
            const today = new Date().toISOString().slice(0, 10);
            const salesToday = db.sales.filter(s => s.date === today);
            const totalSales = salesToday.reduce((a, b) => a + asNumber(b.totalAfter), 0);
            const totalCash = db.cashbox.reduce((a, b) => a + asNumber(b.amount), 0);
            const totalBank = db.bank.reduce((a, b) => a + asNumber(b.amount), 0);
            const lowStock = db.products.filter(p => (asNumber(p.qty_main) + asNumber(p.qty_matriya)) < 5);

            container.innerHTML = `
                <div class="page active">
                    <div class="page-header"><h1><i class="fas fa-home"></i> لوحة القيادة</h1><p>مرحباً ${currentUser.name} - اليوم ${today}</p></div>
                    <div class="cards-grid">
                        <div class="stat-card"><h4>💰 مبيعات اليوم</h4><div class="number">${totalSales.toFixed(2)}</div><div class="sub">عدد الفواتير: ${salesToday.length}</div></div>
                        <div class="stat-card"><h4>🏦 رصيد البنك</h4><div class="number">${totalBank.toFixed(2)}</div></div>
                        <div class="stat-card"><h4>💵 رصيد الصندوق</h4><div class="number">${totalCash.toFixed(2)}</div></div>
                        <div class="stat-card" style="border-color:${lowStock.length > 0 ? '#e74c3c' : '#2ecc71'};"><h4>⚠️ أصناف منخفضة</h4><div class="number" style="color:${lowStock.length > 0 ? '#e74c3c' : '#2ecc71'};">${lowStock.length}</div><div class="sub">${lowStock.map(p=>p.name).join(', ') || 'جميع الأصناف متوفرة'}</div></div>
                    </div>
                    <div class="card-panel">
                        <h3><i class="fas fa-chart-simple"></i> ملخص سريع</h3>
                         <p>إجمالي العملاء: ${db.customers.length} | الموردين: ${db.suppliers.length} | الأصناف: ${db.products.length}</p>
                         <p>🖥️ كاشير (يستخدم البرنامج): ${db.users.filter(u=>u.role==='cashier').length} | 📋 موظفين عاديين: ${db.regularEmployees.length}</p>
                    </div>
                </div>
            `;
        }

        // ================================================================
        // 5. المخزون
        // ================================================================
        function renderInventory(container) {
            container.innerHTML = `
                <div class="page active">
                    <div class="page-header"><h1><i class="fas fa-warehouse"></i> إدارة المخزون والفروع</h1><p>إضافة صنف جديد - حذف - نقل بين الفروع</p></div>
                    <div class="card-panel">
                        <h3><i class="fas fa-plus"></i> إضافة صنف جديد</h3>
                        <div class="form-row">
                            <div class="form-group"><label>الكود</label><input id="pCode" placeholder="مثال: OIL-100"></div>
                            <div class="form-group"><label>الاسم</label><input id="pName" placeholder="نوع الزيت"></div>
                            <div class="form-group"><label>الباركود</label><input id="pBarcode" placeholder="اختياري"></div>
                            <div class="form-group"><label>سعر التكلفة</label><input id="pCost" type="number" placeholder="0"></div>
                            <div class="form-group"><label>سعر البيع</label><input id="pSell" type="number" placeholder="0"></div>
                            <div class="form-group"><label>الكمية (رئيسي)</label><input id="pQtyMain" type="number" value="0"></div>
                            <div class="form-group"><label>الكمية (مطرية)</label><input id="pQtyMat" type="number" value="0"></div>
                            <div class="form-group"><button class="btn btn-success" onclick="addProduct()"><i class="fas fa-save"></i> حفظ</button></div>
                        </div>
                    </div>
                    <div class="card-panel">
                        <h3><i class="fas fa-exchange-alt"></i> نقل مخزون بين الفروع</h3>
                        <div class="form-row">
                            <div class="form-group"><label>اختر الصنف</label><select id="transferProduct"></select></div>
                            <div class="form-group"><label>الكمية</label><input id="transferQty" type="number"></div>
                            <div class="form-group"><label>من</label><select id="transferFrom"><option value="main">الرئيسي</option><option value="matriya">المطرية</option></select></div>
                            <div class="form-group"><label>إلى</label><select id="transferTo"><option value="matriya">المطرية</option><option value="main">الرئيسي</option></select></div>
                            <div class="form-group"><button class="btn btn-gold" onclick="doTransfer()"><i class="fas fa-arrow-right"></i> نقل</button></div>
                        </div>
                    </div>
                    <div class="card-panel">
                        <h3><i class="fas fa-layer-group"></i> إنشاء باقة زيت + فلتر + مصنعية</h3>
                        <div class="form-row">
                            <div class="form-group"><label>اسم الباقة</label><input id="bundleName" placeholder="تغيير زيت كامل"></div>
                            <div class="form-group"><label>سعر الباقة</label><input id="bundlePrice" type="number" min="0" placeholder="0"></div>
                            <div class="form-group"><label>الصنف الأول</label><select id="bundleProduct1"></select></div>
                            <div class="form-group"><label>الكمية</label><input id="bundleQty1" type="number" min="1" value="1"></div>
                            <div class="form-group"><label>الصنف الثاني</label><select id="bundleProduct2"></select></div>
                            <div class="form-group"><label>الكمية</label><input id="bundleQty2" type="number" min="0" value="1"></div>
                            <div class="form-group"><label>الصنف الثالث اختياري</label><select id="bundleProduct3"></select></div>
                            <div class="form-group"><label>الكمية</label><input id="bundleQty3" type="number" min="0" value="0"></div>
                            <div class="form-group"><button class="btn btn-success" onclick="saveBundle()"><i class="fas fa-save"></i> حفظ الباقة</button></div>
                        </div>
                        <div class="table-responsive" id="bundleHistory"></div>
                    </div>
                    <div class="card-panel">
                        <h3><i class="fas fa-list"></i> الأصناف الحالية</h3>
                        <div class="table-responsive">
                            <table><thead><tr><th>الكود</th><th>الاسم</th><th>التكلفة</th><th>البيع</th><th>الرئيسي</th><th>المطرية</th><th>الإجمالي</th><th>حذف</th></tr></thead>
                            <tbody>${db.products.map(p => `
                                <tr><td>${p.code}</td><td>${p.name}</td><td>${p.costPrice}</td><td>${p.sellPrice}</td><td>${p.qty_main}</td><td>${p.qty_matriya}</td><td>${p.qty_main + p.qty_matriya}</td>
                                <td><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button></td></tr>
                            `).join('')}</tbody></table>
                        </div>
                    </div>
                </div>
            `;
            const sel = document.getElementById('transferProduct');
            if (sel) {
                sel.innerHTML = '';
                db.products.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    sel.appendChild(opt);
                });
            }
            ['bundleProduct1', 'bundleProduct2', 'bundleProduct3'].forEach(id => {
                const bundleSelect = document.getElementById(id);
                if (bundleSelect) {
                    bundleSelect.innerHTML = '<option value="">اختر صنفاً</option>' + db.products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
                }
            });
            renderBundleHistory();
        }

        function saveBundle() {
            const name = document.getElementById('bundleName').value.trim();
            const price = asNumber(document.getElementById('bundlePrice').value);
            const items = [1, 2, 3].map(index => ({
                productId: parseInt(document.getElementById(`bundleProduct${index}`).value, 10),
                qty: Math.max(0, asNumber(document.getElementById(`bundleQty${index}`).value))
            })).filter(item => item.productId && item.qty > 0);
            if (!name || price <= 0 || !items.length) {
                alert('أدخل اسم وسعر الباقة واختر صنفاً واحداً على الأقل');
                return;
            }
            db.bundles.push({ id: nextId(db.bundles), name, price, items });
            saveDB(db);
            alert('✅ تم حفظ الباقة');
            navigateTo('inventory');
        }

        function renderBundleHistory() {
            const div = document.getElementById('bundleHistory');
            if (!div) return;
            div.innerHTML = db.bundles.length
                ? `<table><thead><tr><th>الباقة</th><th>السعر</th><th>الأصناف</th><th>حذف</th></tr></thead><tbody>${db.bundles.map(bundle => `<tr><td>${bundle.name}</td><td>${asNumber(bundle.price).toFixed(2)}</td><td>${bundle.items.length}</td><td><button class="btn btn-danger btn-sm" onclick="deleteBundle(${bundle.id})">حذف</button></td></tr>`).join('')}</tbody></table>`
                : '<div class="empty-state">لا توجد باقات محفوظة</div>';
        }

        function deleteBundle(id) {
            if (!requireManager('حذف الباقات')) return;
            if (!confirm('حذف الباقة؟')) return;
            db.bundles = db.bundles.filter(bundle => bundle.id !== id);
            saveDB(db);
            renderBundleHistory();
        }

        function addProduct() {
            const code = document.getElementById('pCode').value.trim();
            const name = document.getElementById('pName').value.trim();
            const barcode = document.getElementById('pBarcode').value.trim();
            const cost = parseFloat(document.getElementById('pCost').value);
            const sell = parseFloat(document.getElementById('pSell').value);
            const qm = parseInt(document.getElementById('pQtyMain').value) || 0;
            const qmat = parseInt(document.getElementById('pQtyMat').value) || 0;
            if (!code || !name || !Number.isFinite(cost) || cost < 0 ||
                !Number.isFinite(sell) || sell < 0 || qm < 0 || qmat < 0) { 
                alert('يرجى ملء الكود والاسم والأسعار بشكل صحيح'); 
                return; 
            }
            db.products.push({ 
                id: nextId(db.products), 
                code, 
                barcode,
                name, 
                costPrice: cost, 
                sellPrice: sell, 
                qty_main: qm,
                qty_matriya: qmat 
            });
            saveDB(db);
            navigateTo('inventory');
            alert('✅ تم إضافة الصنف بنجاح');
        }

        function deleteProduct(id) {
            if (!requireManager('حذف الأصناف من المخزون')) return;
            if (!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
            if (db.sales.some(sale => sale.items.some(item => item.productId === id))) {
                if (!confirm('هذا الصنف موجود في فواتير سابقة. هل تريد حذفه من قائمة المخزون فقط؟')) return;
            }
            db.products = db.products.filter(p => p.id !== id);
            saveDB(db);
            navigateTo('inventory');
        }

        function doTransfer() {
            const pid = parseInt(document.getElementById('transferProduct').value);
            const qty = parseInt(document.getElementById('transferQty').value, 10);
            const from = document.getElementById('transferFrom').value;
            const to = document.getElementById('transferTo').value;
            if (!pid || !Number.isInteger(qty) || qty < 1) { alert('اختر الصنف والكمية الصحيحة'); return; }
            if (from === to) { alert('لا يمكن النقل لنفس الفرع'); return; }
            const prod = db.products.find(p => p.id === pid);
            if (!prod) return;
            if (from === 'main' && prod.qty_main < qty) { alert('الكمية غير كافية في الفرع الرئيسي'); return; }
            if (from === 'matriya' && prod.qty_matriya < qty) { alert('الكمية غير كافية في فرع المطرية'); return; }
            if (from === 'main') { 
                prod.qty_main -= qty;
                prod.qty_matriya += qty; 
            } else { 
                prod.qty_matriya -= qty;
                prod.qty_main += qty; 
            }
            db.transfers.push({ 
                id: db.nextTransferId++, 
                productId: pid, 
                qty, 
                from, 
                to, 
                date: new Date().toISOString().slice(0, 10) 
            });
            saveDB(db);
            navigateTo('inventory');
            alert('✅ تم نقل الكمية بنجاح');
        }

        function renderSaleProductOptions() {
            const select = document.getElementById('saleProduct');
            if (!select) return;
            const search = (document.getElementById('saleSearch')?.value || '').trim().toLowerCase();
            const products = db.products.filter(p =>
                !search ||
                String(p.name).toLowerCase().includes(search) ||
                String(p.code).toLowerCase().includes(search) ||
                String(p.barcode || '').toLowerCase().includes(search)
            );
            select.innerHTML = products.length
                ? products.map(p => `<option value="${p.id}">${p.name} — ${p.code} — المتاح ${asNumber(p.qty_main) + asNumber(p.qty_matriya)}</option>`).join('')
                : '<option value="">لا يوجد صنف مطابق</option>';
            const first = products[0];
            const price = document.getElementById('salePrice');
            if (price && first) price.value = asNumber(first.sellPrice);
        }

        function updateSaleTotals() {
            const before = tempSaleItems.reduce((sum, item) => sum + asNumber(item.qty) * asNumber(item.price), 0);
            const requestedDiscount = asNumber(document.getElementById('discountVal')?.value);
            const discount = Math.min(Math.max(0, requestedDiscount), before);
            const after = before - discount;
            const cash = Math.max(0, asNumber(document.getElementById('cashPaidVal')?.value));
            const bank = Math.max(0, asNumber(document.getElementById('bankPaidVal')?.value));
            const paid = cash + bank;
            const remain = Math.max(0, after - paid);
            const set = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.textContent = value.toFixed(2);
            };
            set('saleTotalBefore', before);
            set('saleTotalAfter', after);
            set('salePaidTotal', paid);
            set('saleRemain', remain);
        }

        function addSaleItem() {
            const pid = parseInt(document.getElementById('saleProduct').value);
            const qty = parseInt(document.getElementById('saleQty').value, 10);
            const price = parseFloat(document.getElementById('salePrice').value);
            const branch = document.getElementById('saleBranch').value;
            const prod = db.products.find(p => p.id === pid);
            if (!prod) {
                alert('الصنف غير موجود');
                return;
            }
            if (!Number.isInteger(qty) || qty < 1) {
                alert('الكمية يجب أن تكون رقماً صحيحاً أكبر من صفر');
                return;
            }
            if (!Number.isFinite(price) || price <= 0) {
                alert('سعر البيع يجب أن يكون أكبر من صفر');
                return;
            }
            const avail = branch === 'main' ? prod.qty_main : prod.qty_matriya;
            const alreadyAdded = tempSaleItems
                .filter(item => item.productId === pid && item.branch === branch)
                .reduce((sum, item) => sum + item.qty, 0);
            if (avail < alreadyAdded + qty) { 
                alert(`الكمية غير كافية في ${branch === 'main' ? 'الرئيسي' : 'المطرية'}. المتاح: ${avail}`); 
                return; 
            }
            const existing = tempSaleItems.find(item => item.productId === pid && item.branch === branch && asNumber(item.price) === price);
            if (existing) existing.qty += qty;
            else tempSaleItems.push({ productId: pid, name: prod.name, qty, price, branch });
            renderSalePreview();
        }

        function renderSalePreview() {
            const div = document.getElementById('salePreview');
            if (tempSaleItems.length === 0) { 
                div.innerHTML = '<p class="empty-state">لم يتم إضافة أصناف</p>'; 
                updateSaleTotals();
                return; 
            }
            let html = `<table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>الفرع</th><th>تحكم</th></tr></thead><tbody>`;
            let total = 0;
            tempSaleItems.forEach((it, idx) => {
                const t = it.qty * it.price;
                total += t;
                html += `<tr><td>${it.name}</td><td><input type="number" min="1" value="${it.qty}" onchange="changeSaleQty(${idx}, this.value)" style="width:80px"></td><td>${asNumber(it.price).toFixed(2)}</td><td>${t.toFixed(2)}</td><td>${it.branch === 'main' ? 'رئيسي' : 'مطرية'}</td><td><button class="btn btn-danger btn-sm" onclick="removeSaleItem(${idx})"><i class="fas fa-times"></i></button></td></tr>`;
            });
            html += `<tr style="border-top:2px solid #f1c40f;"><td colspan="3">الإجمالي</td><td colspan="3">${total.toFixed(2)}</td></tr>`;
            html += `</tbody></table>`;
            div.innerHTML = html;
            updateSaleTotals();
        }

        function changeSaleQty(index, value) {
            const qty = parseInt(value, 10);
            const item = tempSaleItems[index];
            const product = item && db.products.find(p => p.id === item.productId);
            const available = product ? (item.branch === 'main' ? asNumber(product.qty_main) : asNumber(product.qty_matriya)) : 0;
            if (!item || !Number.isInteger(qty) || qty < 1 || qty > available) {
                alert('الكمية غير صحيحة أو أكبر من المخزون');
                renderSalePreview();
                return;
            }
            item.qty = qty;
            renderSalePreview();
        }

        function removeSaleItem(idx) { 
            tempSaleItems.splice(idx, 1);
            renderSalePreview(); 
        }

        function saveSale() {
            if (tempSaleItems.length === 0) { 
                alert('أضف أصنافاً للفاتورة'); 
                return; 
            }

            const custSelect = document.getElementById('custSelect');
            let customerId = parseInt(custSelect.value);
            let custName = document.getElementById('custName').value.trim();
            let custPhone = document.getElementById('custPhone').value.trim();
            
            if (custSelect.value === 'new' || !customerId) {
                if (!custName) { 
                    alert('يرجى إدخال اسم العميل'); 
                    return; 
                }
            }

            const totalBefore = tempSaleItems.reduce((s, i) => s + (i.qty * i.price), 0);
            const discountInput = parseFloat(document.getElementById('discountVal').value);
            const cashPaid = Math.max(0, asNumber(document.getElementById('cashPaidVal').value));
            const bankPaid = Math.max(0, asNumber(document.getElementById('bankPaidVal').value));
            const paid = cashPaid + bankPaid;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const discount = Number.isFinite(discountInput) ? discountInput : 0;
            if (discount < 0 || paid < 0) {
                alert('الخصم والمدفوع لا يمكن أن يكونا سالبين');
                return;
            }

            // التأكد من أن الخصم والمدفوع لا يتجاوزان الإجمالي.
            const finalDiscount = Math.min(discount, totalBefore);
            const totalAfter = totalBefore - finalDiscount;
            if (paid > totalAfter) {
                alert('المدفوع لا يمكن أن يتجاوز الإجمالي النهائي للفاتورة');
                return;
            }
            if (paymentMethod === 'cash' && bankPaid > 0) {
                alert('طريقة الدفع نقدي، اترك المدفوع البنكي صفراً أو اختر نقدي + بنك');
                return;
            }
            if (paymentMethod === 'bank' && cashPaid > 0) {
                alert('طريقة الدفع بنك، اترك المدفوع النقدي صفراً أو اختر نقدي + بنك');
                return;
            }
            if (paymentMethod === 'credit' && paid > 0) {
                alert('الفاتورة الآجلة لا تحتاج مدفوعاً الآن');
                return;
            }
            if (paymentMethod !== 'credit' && paid === 0 && totalAfter > 0) {
                alert('أدخل المبلغ المدفوع أو اختر آجل');
                return;
            }
            const remain = totalAfter - paid;

            // إعادة فحص المخزون قبل الحفظ حتى لا يؤدي تكرار الصنف في الفاتورة
            // إلى بيع كمية أكبر من المتاح.
            const requiredStock = {};
            tempSaleItems.forEach(item => {
                const key = `${item.productId}_${item.branch}`;
                requiredStock[key] = (requiredStock[key] || 0) + item.qty;
            });
            for (const [key, required] of Object.entries(requiredStock)) {
                const [productId, branch] = key.split('_');
                const product = db.products.find(p => p.id === Number(productId));
                const available = product
                    ? (branch === 'main' ? product.qty_main : product.qty_matriya)
                    : 0;
                if (!product || available < required) {
                    alert('تغيرت الكمية المتاحة. راجع المخزون ثم حاول مرة أخرى');
                    return;
                }
            }

            let customer = db.customers.find(c => c.id === customerId);
            if (!customer && custSelect.value !== 'new') {
                alert('بيانات العميل غير موجودة');
                return;
            }
            if (!customer) {
                customer = {
                    id: db.nextCustId++,
                    name: custName,
                    phone: custPhone || 'غير مسجل',
                    balance: 0
                };
                db.customers.push(customer);
                customerId = customer.id;
            }
            custName = customer.name;
            custPhone = customer.phone || custPhone || 'غير مسجل';

            const sale = {
                id: db.nextSaleId++,
                customerId,
                customerName: custName,
                customerPhone: custPhone,
                items: tempSaleItems.map(i => ({ 
                    productId: i.productId, 
                    name: i.name,
                    qty: i.qty, 
                    price: i.price, 
                    branch: i.branch 
                })),
                discount: finalDiscount,
                totalBefore,
                totalAfter,
                paid,
                cashPaid,
                bankPaid,
                paymentMethod,
                remain,
                date: new Date().toISOString().slice(0, 10),
                cashier: currentUser.name
            };
            
            db.sales.push(sale);
            customer.balance = (Number(customer.balance) || 0) + remain;
            
            // تحديث المخزون
            sale.items.forEach(it => {
                const prod = db.products.find(p => p.id === it.productId);
                if (prod) {
                    if (it.branch === 'main') {
                        prod.qty_main = Math.max(0, prod.qty_main - it.qty);
                    } else {
                        prod.qty_matriya = Math.max(0, prod.qty_matriya - it.qty);
                    }
                }
            });
            
            // تحديث الصندوق
            if (paid > 0) {
                if (cashPaid > 0) {
                    db.cashbox.push({ 
                        id: nextId(db.cashbox), 
                        saleId: sale.id,
                        amount: cashPaid, 
                        date: sale.date,
                        description: `مبيعات نقدية فاتورة ${sale.id}` 
                    });
                }
                if (bankPaid > 0) {
                    db.bank.push({ 
                        id: nextId(db.bank), 
                        saleId: sale.id,
                        amount: bankPaid, 
                        date: sale.date,
                        description: `مبيعات بنكية فاتورة ${sale.id}` 
                    });
                }
            }
            
            saveDB(db);
            printReceipt(sale);
            navigateTo('sales');
            alert('✅ تم حفظ الفاتورة وطباعتها');
        }

        function clearSaleDraft() {
            if (!confirm('تفريغ الفاتورة الحالية؟')) return;
            navigateTo('sales');
        }

        function holdCurrentSale() {
            if (!tempSaleItems.length) {
                alert('أضف أصنافاً قبل تعليق الفاتورة');
                return;
            }
            const customer = document.getElementById('custName').value.trim() || 'عميل نقدي';
            db.heldSales.push({
                id: nextId(db.heldSales),
                customerId: parseInt(document.getElementById('custSelect').value, 10) || null,
                customerName: customer,
                customerPhone: document.getElementById('custPhone').value.trim(),
                items: JSON.parse(JSON.stringify(tempSaleItems)),
                discount: Math.max(0, asNumber(document.getElementById('discountVal').value)),
                cashPaid: Math.max(0, asNumber(document.getElementById('cashPaidVal').value)),
                bankPaid: Math.max(0, asNumber(document.getElementById('bankPaidVal').value)),
                createdAt: new Date().toISOString()
            });
            saveDB(db);
            alert('✅ تم تعليق الفاتورة');
            navigateTo('sales');
        }

        function renderHeldSales() {
            const el = document.getElementById('heldSalesList');
            if (!el) return;
            if (!db.heldSales.length) {
                el.innerHTML = '<div class="empty-state">لا توجد فواتير معلقة</div>';
                return;
            }
            el.innerHTML = `<table><thead><tr><th>رقم</th><th>العميل</th><th>الأصناف</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody>${
                db.heldSales.map(item => `<tr><td>${item.id}</td><td>${item.customerName}</td><td>${item.items.length}</td><td>${String(item.createdAt).slice(0, 16).replace('T', ' ')}</td><td><button class="btn btn-primary btn-sm" onclick="resumeHeldSale(${item.id})">استكمال</button> <button class="btn btn-danger btn-sm" onclick="deleteHeldSale(${item.id})">حذف</button></td></tr>`).join('')
            }</tbody></table>`;
        }

        function resumeHeldSale(id) {
            const held = db.heldSales.find(item => item.id === id);
            if (!held) return;
            tempSaleItems = JSON.parse(JSON.stringify(held.items || []));
            db.heldSales = db.heldSales.filter(item => item.id !== id);
            saveDB(db);
            const customerSelect = document.getElementById('custSelect');
            if (customerSelect && held.customerId && db.customers.some(item => item.id === held.customerId)) {
                customerSelect.value = String(held.customerId);
                customerSelect.dispatchEvent(new Event('change'));
            }
            document.getElementById('custName').value = held.customerName || '';
            document.getElementById('custPhone').value = held.customerPhone || '';
            document.getElementById('discountVal').value = asNumber(held.discount);
            document.getElementById('cashPaidVal').value = asNumber(held.cashPaid);

            const customer = db.customers.find(item => item.id === customerId);
            if (!customer || amount <= 0) {

                return;

            if (amount > asNumber(customer.balance)) {

                return;

            customer.balance = Math.max(0, asNumber(customer.balance) - amount);
            const payment = { id: nextId(db.customerPayments), customerId, customerName: customer.name, amount, method, date: new Date().toISOString().slice(0, 10) };
            db.customerPayments.push(payment);
            const target = method === 'bank' ? db.bank : db.cashbox;
            target.push({ id: nextId(target), amount, date: payment.date, description: `تحصيل من ${customer.name}` });

        function deleteSale(id) {
            if (!requireManager('حذف فواتير المبيعات')) return;
            const sale = db.sales.find(item => item.id === id);
            if (!sale) return;
            if (!confirm(`حذف فاتورة رقم ${id} نهائياً؟ سيتم عكس المخزون والرصيد المالي.`)) return;
            if (sale.status !== 'returned') {
                sale.items.forEach(item => {
                    const product = db.products.find(p => p.id === item.productId);
                    if (product) {
                        if (item.branch === 'main') product.qty_main = asNumber(product.qty_main) + asNumber(item.qty);
                        else product.qty_matriya = asNumber(product.qty_matriya) + asNumber(item.qty);
                    }
                });
                const customer = db.customers.find(item => item.id === sale.customerId);
                if (customer) customer.balance = Math.max(0, asNumber(customer.balance) - asNumber(sale.remain));
            }
            db.cashbox = db.cashbox.filter(entry => entry.saleId !== id);
            db.bank = db.bank.filter(entry => entry.saleId !== id);
            db.returns = db.returns.filter(item => item.saleId !== id);
            db.sales = db.sales.filter(item => item.id !== id);
            saveDB(db);
            alert('✅ تم حذف الفاتورة وعكس أثرها');
            navigateTo('sales');
        }

        function returnSale(id) {
            if (!requireManager('تنفيذ مرتجع أو إلغاء فاتورة')) return;
            const sale = db.sales.find(item => item.id === id);
            if (!sale) return;
            const permission = prompt('أدخل كلمة مرور المدير لتأكيد المرتجع');
            if (permission === null) return;
            const manager = db.users.find(user => user.role === 'admin');
            if (!manager || permission !== manager.password) {
                alert('غير مصرح. استخدم كلمة مرور المدير');
                return;
            }
            if (db.returns.some(item => item.saleId === id)) {
                alert('تم تنفيذ مرتجع لهذه الفاتورة من قبل');
                return;
            }
            sale.items.forEach(item => {
                const product = db.products.find(p => p.id === item.productId);
                if (product) {
                    if (item.branch === 'main') product.qty_main = asNumber(product.qty_main) + asNumber(item.qty);
                    else product.qty_matriya = asNumber(product.qty_matriya) + asNumber(item.qty);
                }
            });
            const customer = db.customers.find(item => item.id === sale.customerId);
            if (customer) customer.balance = Math.max(0, asNumber(customer.balance) - asNumber(sale.remain));
            db.returns.push({ id: nextId(db.returns), saleId: id, amount: asNumber(sale.totalAfter), date: new Date().toISOString().slice(0, 10), cashier: currentUser.name });
            sale.status = 'returned';
            saveDB(db);
            alert('✅ تم تنفيذ المرتجع وإعادة الكميات للمخزون');
            navigateTo('sales');
        }

        function savePurchase() {
            const sel = document.getElementById('suppSelect');
            let suppId = parseInt(sel.value);
            let name = document.getElementById('suppName').value.trim();
            let phone = document.getElementById('suppPhone').value.trim();
            let newSupplier = null;
            
            if (sel.value === 'new' || !suppId) {
                if (!name) { 
                    alert('ادخل اسم المورد'); 
                    return; 
                }
                newSupplier = { 
                    id: db.nextSuppId++, 
                    name: name, 
                    phone: phone || 'غير مسجل', 
                    balance: 0 
                };
                suppId = newSupplier.id;
            } else {
                const supplier = db.suppliers.find(s => s.id === suppId);
                if (!supplier) {
                    alert('المورد غير موجود');
                    return;
                }
                name = supplier.name;
                phone = supplier.phone || 'غير مسجل';
            }
            
            const rows = document.querySelectorAll('#purchaseRowsContainer .row-item');
            let items = [];
            let totalCost = 0;
            let hasValidItem = false;
            
            rows.forEach(row => {
                const n = row.querySelector('.pName').value.trim();
                const q = parseInt(row.querySelector('.pQty').value, 10);
                const b = parseFloat(row.querySelector('.pBuy').value);
                const s = parseFloat(row.querySelector('.pSell').value);
                if (n && Number.isInteger(q) && q > 0 && Number.isFinite(b) && b > 0 &&
                    Number.isFinite(s) && s >= 0) {
                    hasValidItem = true;
                    items.push({ name: n, qty: q, buyPrice: b, sellPrice: s });
                    totalCost += b * q;
                    
                    // البحث عن المنتج أو إضافته
                    let prod = db.products.find(p => p.name === n);
                    if (!prod) {
                        const productId = nextId(db.products);
                        db.products.push({ 
                            id: productId, 
                            code: 'SUP-' + productId, 
                            name: n,
                            costPrice: b, 
                            sellPrice: s, 
                            qty_main: document.getElementById('purchaseBranch').value === 'main' ? q : 0, 
                            qty_matriya: document.getElementById('purchaseBranch').value === 'matriya' ? q : 0 
                        });
                    } else {
                        // تحديث الأسعار والكمية
                        prod.costPrice = b;
                        prod.sellPrice = s;
                        if (document.getElementById('purchaseBranch').value === 'main') prod.qty_main = asNumber(prod.qty_main) + q;
                        else prod.qty_matriya = asNumber(prod.qty_matriya) + q;
                    }
                }
            });
            
            if (!hasValidItem) { 
                alert('أضف صنفاً واحداً على الأقل مع بيانات صحيحة'); 
                return; 
            }

            if (newSupplier) {
                db.suppliers.push(newSupplier);
            }
            const paid = Math.min(totalCost, Math.max(0, asNumber(document.getElementById('purchasePaid').value)));
            const paymentMethod = document.getElementById('purchasePaymentMethod').value;
            if (paymentMethod === 'credit' && paid > 0) {
                alert('التوريد الآجل لا يحتاج مبلغاً مدفوعاً');
                return;
            }
            const remain = totalCost - paid;
            db.purchases.push({ 
                id: db.nextPurchaseId++, 
                supplierId: suppId, 
                supplierName: name, 
                items, 
                totalCost,
                paid,
                remain,
                paymentMethod,
                branch: document.getElementById('purchaseBranch').value,
                date: new Date().toISOString().slice(0, 10) 
            });
            const savedPurchase = db.purchases[db.purchases.length - 1];
            const supplier = db.suppliers.find(s => s.id === suppId);
            if (supplier) {
                supplier.balance = (Number(supplier.balance) || 0) + remain;
            }
            if (paid > 0) {
                const target = paymentMethod === 'bank' ? db.bank : db.cashbox;
                target.push({ id: nextId(target), purchaseId: savedPurchase.id, amount: -paid, date: savedPurchase.date, description: `دفع توريد من ${name}` });
            }
            
            saveDB(db);
            renderPurchases(document.getElementById('mainContent'));
            alert('✅ تم حفظ التوريد وإضافة الكميات للمخزن');
        }

        function renderPurchaseHistory() {
            const div = document.getElementById('purchaseHistory');
            if (!div) return;
            if (db.purchases.length === 0) { 
                div.innerHTML = '<p style="color:rgba(255,255,255,0.3);">لا توجد توريدات</p>';

            }
            let html = `<table><thead><tr><th>المورد</th><th>الفرع</th><th>التاريخ</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>إجراء</th></tr></thead><tbody>`;

        function deletePurchase(id) {
            if (!requireManager('حذف فواتير التوريد')) return;
            const purchase = db.purchases.find(item => item.id === id);
            if (!purchase) return;
            if (!confirm(`حذف توريد ${purchase.supplierName} وإرجاع أثره من المخزون؟`)) return;
            purchase.items.forEach(item => {
                const product = db.products.find(p => p.name === item.name);
                if (!product) return;
                if (purchase.branch === 'matriya') {
                    product.qty_matriya = Math.max(0, asNumber(product.qty_matriya) - asNumber(item.qty));
                } else {
                    product.qty_main = Math.max(0, asNumber(product.qty_main) - asNumber(item.qty));
                }
            });
            const supplier = db.suppliers.find(item => item.id === purchase.supplierId);
            if (supplier) supplier.balance = Math.max(0, asNumber(supplier.balance) - asNumber(purchase.remain));
            db.cashbox = db.cashbox.filter(entry => entry.purchaseId !== id);
            db.bank = db.bank.filter(entry => entry.purchaseId !== id);
            db.purchases = db.purchases.filter(item => item.id !== id);
            saveDB(db);
            renderPurchases(document.getElementById('mainContent'));
            alert('✅ تم حذف التوريد وإرجاع أثره');
        }

        function calculatePayroll() {
            const employeeSelect = document.getElementById('empPaySelect');
            if (!employeeSelect) {
                alert('تعذر تحميل قائمة الموظفين. أعد فتح صفحة الموظفين');
                return;
            }
            const val = employeeSelect.value;
            const advanceInput = parseFloat(document.getElementById('empAdvance').value);
            const absenceInput = parseInt(document.getElementById('empAbsence').value, 10);
            const advance = Number.isFinite(advanceInput) ? advanceInput : 0;
            const absence = Number.isFinite(absenceInput) ? absenceInput : 0;
            
            if (!val) { 
                alert('اختر موظفاً أولاً'); 
                return; 
            }
            if (advance < 0 || absence < 0) {
                alert('السلف وأيام الغياب لا يمكن أن تكون سالبة');
                return;
            }

            let emp = null;
            let type = '';
            const parts = val.split('_');
            
            if (parts[0] === 'cashier') {
                emp = db.users.find(u => u.id === parseInt(parts[1]));
                type = 'كاشير';
            } else if (parts[0] === 'regular') {
                emp = db.regularEmployees.find(e => e.id === parseInt(parts[1]));
                type = 'عادي';
            }

            if (!emp) { 
                alert('الموظف غير موجود'); 
                return; 
            }

            // التأكد من أن السلف والغياب لا تتجاوز الراتب
            const salary = asNumber(emp.salary);
            const dailyRate = salary / 30;
            const absenceDeduction = absence * dailyRate;
            const totalDeduction = absenceDeduction + advance;
            const netSalary = Math.max(0, salary - totalDeduction);

            document.getElementById('payrollResult').innerHTML = `
                <p>الموظف: <strong>${emp.name}</strong> (${type})</p>
                 <p>الراتب الأساسي: ${salary.toFixed(2)}</p>
                <p>خصم الغياب (${absence} يوم): ${absenceDeduction.toFixed(2)}</p>
                <p>السلف: ${advance.toFixed(2)}</p>
                <p style="font-size:24px; font-weight:bold; color:#2ecc71;">صافي الراتب: ${netSalary.toFixed(2)}</p>
                <button class="btn btn-success" onclick="confirmPayroll('${val}', ${netSalary})"><i class="fas fa-check"></i> تأكيد صرف الراتب</button>
            `;
        }

        function confirmPayroll(val, net) {
            const amount = asNumber(net);
            if (amount < 0) {
                alert('لا يمكن صرف راتب سالب');
                return;
            }
            
            const parts = val.split('_');
            let emp = null;
            if (parts[0] === 'cashier') {
                emp = db.users.find(u => u.id === parseInt(parts[1]));
            } else if (parts[0] === 'regular') {
                emp = db.regularEmployees.find(e => e.id === parseInt(parts[1]));
            }
            if (!emp) {
                alert('الموظف غير موجود أو تم حذفه');
                return;
            }
            emp.advances = 0;
            emp.absences = 0;
            
            db.cashbox.push({
                id: nextId(db.cashbox),
                amount: -amount,
                date: new Date().toISOString().slice(0, 10),
                description: `صرف راتب`
            });
            db.payrollHistory.push({
                id: nextId(db.payrollHistory),
                employeeId: emp.id,
                employeeName: emp.name,
                amount,
                date: new Date().toISOString().slice(0, 10),
                cashier: currentUser.name
            });
            
            saveDB(db);
            renderEmployeeList();
            fillPayrollSelect();
            document.getElementById('payrollResult').innerHTML = '';
            document.getElementById('empAdvance').value = '0';
            document.getElementById('empAbsence').value = '0';
            alert('✅ تم صرف الراتب بنجاح');
        }

            if (!requireManager('حذف المصروفات')) return;

            if (!confirm(`حذف المصروف "${expense.description}"؟ سيتم عكسه في الصندوق.`)) return;
            db.expenses = db.expenses.filter(item => item.id !== id);
            const cashEntry = db.cashbox.find(entry => entry.expenseId === id);

                    entry.description === `مصروف: ${expense.description}` &&

        function getFinancialSummary() {
            const sales = db.sales.filter(sale => sale.status !== 'returned');
            const salesTotal = sales.reduce((sum, sale) => sum + asNumber(sale.totalAfter), 0);
            const costOfGoods = sales.reduce((sum, sale) => sum + sale.items.reduce((itemSum, item) => {
                const product = db.products.find(p => p.id === item.productId);
                return itemSum + asNumber(item.qty) * asNumber(product?.costPrice);
            }, 0), 0);
            const expenses = db.expenses.reduce((sum, expense) => sum + asNumber(expense.amount), 0);
            const setupExpenses = db.setupExpenses.reduce((sum, expense) => sum + asNumber(expense.amount), 0);
            const grossProfit = salesTotal - costOfGoods;
            return {
                salesTotal,
                costOfGoods,
                expenses,
                setupExpenses,
                grossProfit,
                netProfit: grossProfit - expenses,
                netAfterSetup: grossProfit - expenses - setupExpenses,
                cash: db.cashbox.reduce((sum, entry) => sum + asNumber(entry.amount), 0),
                bank: db.bank.reduce((sum, entry) => sum + asNumber(entry.amount), 0)
            };
        }

        function generateReport(type) {
            const div = document.getElementById('reportResult');
            let filtered = [];
            const now = new Date();
            const today = now.toISOString().slice(0, 10);
            const month = today.slice(0, 7);
            const year = today.slice(0, 4);

            if (type === 'daily') filtered = db.sales.filter(s => s.date === today);
            else if (type === 'monthly') filtered = db.sales.filter(s => s.date.startsWith(month));
            else filtered = db.sales.filter(s => s.date.startsWith(year));
            const cashier = document.getElementById('reportCashier')?.value || '';
            const branch = document.getElementById('reportBranch')?.value || '';
            const payment = document.getElementById('reportPayment')?.value || '';
            filtered = filtered.filter(sale =>
                sale.status !== 'returned' &&
                (!cashier || sale.cashier === cashier) &&
                (!payment || sale.paymentMethod === payment) &&
                (!branch || sale.items.some(item => item.branch === branch))
            );

            const total = filtered.reduce((a, b) => a + asNumber(b.totalAfter), 0);
            const count = filtered.length;
            
            const expenses = db.expenses.filter(e => {
                if (type === 'daily') return e.date === today;
                if (type === 'monthly') return e.date.startsWith(month);
                return e.date.startsWith(year);
            });
            const totalExp = expenses.reduce((a, b) => a + asNumber(b.amount), 0);
            const paidCash = filtered.reduce((sum, sale) => sum + asNumber(sale.cashPaid, sale.paymentMethod === 'cash' ? sale.paid : 0), 0);
            const paidBank = filtered.reduce((sum, sale) => sum + asNumber(sale.bankPaid, sale.paymentMethod === 'bank' ? sale.paid : 0), 0);
            const credit = filtered.reduce((sum, sale) => sum + asNumber(sale.remain), 0);
            const itemTotals = {};
            filtered.forEach(sale => sale.items.forEach(item => {
                const key = item.name || 'صنف';
                itemTotals[key] = (itemTotals[key] || 0) + asNumber(item.qty);
            }));
            const topItems = Object.entries(itemTotals).sort((a, b) => b[1] - a[1]).slice(0, 8);

            div.innerHTML = `
                <p><strong>الفترة:</strong> ${type === 'daily' ? today : type === 'monthly' ? month : year}</p>
                <p>عدد الفواتير: ${count}</p>
                <p>إجمالي المبيعات: ${total.toFixed(2)}</p>
                <p>نقدي: ${paidCash.toFixed(2)} | بنك: ${paidBank.toFixed(2)} | آجل: ${credit.toFixed(2)}</p>
                <p>إجمالي المصروفات: ${totalExp.toFixed(2)}</p>
                <p style="font-size:20px; color:#f1c40f;">صافي الربح: ${(total - totalExp).toFixed(2)}</p>
                <h3 style="margin-top:20px;">الأصناف الأكثر بيعاً</h3>
                ${topItems.length ? `<table><thead><tr><th>الصنف</th><th>الكمية المباعة</th></tr></thead><tbody>${topItems.map(([name, qty]) => `<tr><td>${name}</td><td>${qty}</td></tr>`).join('')}</tbody></table>` : '<div class="empty-state">لا توجد أصناف في هذه الفترة</div>'}
            `;
        }

        function exportFullExcel() {
            try {
                const wb = XLSX.utils.book_new();
                
                // البيانات مع تحقق من وجودها
                const salesData = db.sales.map(s => ({ 
                    'رقم': s.id, 
                    'العميل': s.customerName, 
                    'التاريخ': s.date, 
                    'الإجمالي': s.totalAfter, 
                    'المدفوع': s.paid, 
                    'المتبقي': s.remain 
                }));
                const s1 = XLSX.utils.json_to_sheet(salesData);
                XLSX.utils.book_append_sheet(wb, s1, 'المبيعات');

                const purchasesData = db.purchases.map(p => ({ 
                    'المورد': p.supplierName, 
                    'التاريخ': p.date, 
                    'الإجمالي': p.totalCost 
                }));
                const s2 = XLSX.utils.json_to_sheet(purchasesData);
                XLSX.utils.book_append_sheet(wb, s2, 'التوريدات');

                const expensesData = db.expenses.map(e => ({ 
                    'التصنيف': e.category, 
                    'البيان': e.description, 
                    'المبلغ': e.amount, 
                    'التاريخ': e.date 
                }));
                const s3 = XLSX.utils.json_to_sheet(expensesData);
                XLSX.utils.book_append_sheet(wb, s3, 'المصروفات');

                const productsData = db.products.map(p => ({ 
                    'الكود': p.code, 
                    'الاسم': p.name, 
                    'الرئيسي': p.qty_main, 
                    'المطرية': p.qty_matriya, 
                    'سعر التكلفة': p.costPrice, 
                    'سعر البيع': p.sellPrice 
                }));
                const s4 = XLSX.utils.json_to_sheet(productsData);
                XLSX.utils.book_append_sheet(wb, s4, 'المخزون');

                const customersData = db.customers.map(c => ({ 
                    'العميل': c.name, 
                    'التلفون': c.phone, 
                    'الرصيد': c.balance 
                }));
                const s5 = XLSX.utils.json_to_sheet(customersData);
                XLSX.utils.book_append_sheet(wb, s5, 'العملاء');

                // إضافة بيانات الموظفين
                const employeesData = [];
                db.users.filter(u => u.role === 'cashier').forEach(u => {
                    employeesData.push({ 'الاسم': u.name, 'النوع': 'كاشير', 'الراتب': u.salary, 'السلف': u.advances, 'الغياب': u.absences });
                });
                db.regularEmployees.forEach(e => {
                    employeesData.push({ 'الاسم': e.name, 'النوع': 'عادي', 'الراتب': e.salary, 'السلف': e.advances, 'الغياب': e.absences });
                });
                const s6 = XLSX.utils.json_to_sheet(employeesData);
                XLSX.utils.book_append_sheet(wb, s6, 'الموظفين');

                XLSX.writeFile(wb, `تقرير_ابوالسعود_${new Date().toISOString().slice(0,10)}.xlsx`);
                alert('✅ تم تصدير Excel الشامل بنجاح');
            } catch (error) {
                alert('حدث خطأ أثناء تصدير Excel: ' + error.message);
            }
        }

        // ================================================================
        // 12. طباعة الفاتورة - نسخة محسنة
        // ================================================================
        function printReceipt(sale) {
            // تحديث بيانات الإيصال
            document.getElementById('rInvoiceNo').innerText = sale.id || 'غير محدد';
            document.getElementById('rDate').innerText = sale.date || new Date().toISOString().slice(0, 10);
            document.getElementById('rCustomer').innerText = sale.customerName || 'عميل';
            document.getElementById('rPhone').innerText = sale.customerPhone || '';
            
            let html = '';
            if (sale.items && sale.items.length > 0) {
                sale.items.forEach(it => {
                    const prod = db.products.find(p => p.id === it.productId);
                    const itemName = it.name || (prod ? prod.name : 'صنف غير معروف');
                    const itemQty = asNumber(it.qty);
                    const itemPrice = asNumber(it.price);
                    html += `<tr><td>${itemName}</td><td>${itemQty}</td><td>${itemPrice.toFixed(2)}</td><td>${(itemQty * itemPrice).toFixed(2)}</td></tr>`;
                });
            } else {
                html += `<tr><td colspan="4" style="text-align:center;">لا توجد أصناف</td></tr>`;
            }
            document.getElementById('rItems').innerHTML = html;
            document.getElementById('rTotalBefore').innerText = asNumber(sale.totalBefore).toFixed(2);
            document.getElementById('rDiscount').innerText = asNumber(sale.discount).toFixed(2);
            document.getElementById('rTotalAfter').innerText = asNumber(sale.totalAfter).toFixed(2);
            document.getElementById('rPaid').innerText = asNumber(sale.paid).toFixed(2);
            document.getElementById('rRemain').innerText = asNumber(sale.remain).toFixed(2);
            
            // طباعة الفاتورة
            setTimeout(() => {
                window.print();
            }, 300);
        }

        // ================================================================
        // 13. تسجيل الخروج
        // ================================================================
        function logout() {
            if (!confirm('تسجيل الخروج؟')) return;
            currentUser = null;
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').style.display = 'none';
        }

        // ================================================================
        // 14. أحداث إضافية
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') {
                handleLogin();
            }
        });

        console.log('🚀 النظام المتكامل v4.7 - جميع الأخطاء تم حلها');
        console.log('📊 قاعدة البيانات تحتوي على:', {
            users: db.users.length,
            products: db.products.length,
            customers: db.customers.length,
            suppliers: db.suppliers.length,
            sales: db.sales.length,
            purchases: db.purchases.length,
            expenses: db.expenses.length
        });
    </script>
